<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Login – STARQ INDUSTRIEZ</title>

  <!-- Supabase SDK -->
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      background: #0A0A0A;
      color: #E0E0E0;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 20px;
    }
    .auth-container {
      background: #141414;
      border: 1px solid #222;
      border-radius: 16px;
      padding: 40px 35px;
      max-width: 420px;
      width: 100%;
      box-shadow: 0 0 40px rgba(0, 243, 255, 0.05);
    }
    .logo h1 {
      color: #00f3ff;
      font-size: 2rem;
      font-weight: 700;
      letter-spacing: 2px;
      text-align: center;
      margin-bottom: 6px;
    }
    .logo p {
      color: #888;
      text-align: center;
      font-size: 0.9rem;
      margin-bottom: 30px;
    }
    .toggle-btns {
      display: flex;
      gap: 10px;
      margin-bottom: 25px;
    }
    .toggle-btns button {
      flex: 1;
      padding: 10px;
      background: #1E1E1E;
      border: 1px solid #333;
      border-radius: 8px;
      color: #888;
      font-weight: 600;
      cursor: pointer;
      transition: 0.3s;
      font-size: 0.95rem;
    }
    .toggle-btns button.active {
      background: #00f3ff;
      color: #0A0A0A;
      border-color: #00f3ff;
    }
    .toggle-btns button:hover { border-color: #00f3ff; }
    .form-group { margin-bottom: 18px; }
    .form-group label {
      display: block;
      color: #aaa;
      font-size: 0.85rem;
      margin-bottom: 5px;
    }
    .form-group input {
      width: 100%;
      padding: 12px 14px;
      background: #0A0A0A;
      border: 1px solid #333;
      border-radius: 8px;
      color: #E0E0E0;
      font-size: 1rem;
      outline: none;
      transition: 0.3s;
    }
    .form-group input:focus { border-color: #00f3ff; }
    .btn-primary {
      width: 100%;
      padding: 14px;
      background: #00f3ff;
      color: #0A0A0A;
      font-weight: 700;
      border: none;
      border-radius: 8px;
      font-size: 1rem;
      cursor: pointer;
      transition: 0.3s;
      margin-top: 8px;
    }
    .btn-primary:hover {
      background: #00c8d4;
      box-shadow: 0 0 20px rgba(0, 243, 255, 0.3);
    }
    .error-msg { color: #ff0055; font-size: 0.85rem; margin-top: 12px; text-align: center; min-height: 24px; }
    .success-msg { color: #39ff14; font-size: 0.85rem; margin-top: 12px; text-align: center; min-height: 24px; }
    .switch-text {
      text-align: center;
      color: #888;
      font-size: 0.9rem;
      margin-top: 18px;
    }
    .switch-text span { color: #00f3ff; cursor: pointer; font-weight: 600; }
    .switch-text span:hover { text-decoration: underline; }
    .footer-text {
      text-align: center;
      color: #555;
      font-size: 0.75rem;
      margin-top: 25px;
      border-top: 1px solid #222;
      padding-top: 18px;
    }
    .hidden { display: none; }
  </style>
</head>
<body>

<div class="auth-container">
  <div class="logo">
    <h1>⚡ STARQ INDUSTRIEZ</h1>
    <p>Secure. Simple. One-time payment.</p>
  </div>

  <div class="toggle-btns">
    <button id="loginToggle" class="active" onclick="showLogin()">Login</button>
    <button id="signupToggle" onclick="showSignup()">Sign Up</button>
  </div>

  <!-- ===== LOGIN FORM ===== -->
  <div id="loginForm">
    <div class="form-group">
      <label>Email Address</label>
      <input type="email" id="loginEmail" placeholder="you@example.com" />
    </div>
    <div class="form-group">
      <label>Password</label>
      <input type="password" id="loginPassword" placeholder="••••••••" />
    </div>
    <button class="btn-primary" id="loginBtn" onclick="handleLogin()">Login</button>
    <div id="loginError" class="error-msg"></div>
    <div id="loginSuccess" class="success-msg"></div>
  </div>

  <!-- ===== SIGN-UP FORM ===== -->
  <div id="signupForm" class="hidden">
    <div class="form-group">
      <label>Full Name</label>
      <input type="text" id="signupName" placeholder="Your Name" />
    </div>
    <div class="form-group">
      <label>Email Address</label>
      <input type="email" id="signupEmail" placeholder="you@example.com" />
    </div>
    <div class="form-group">
      <label>Password</label>
      <input type="password" id="signupPassword" placeholder="•••••••• (min 6 chars)" />
    </div>
    <button class="btn-primary" id="signupBtn" onclick="handleSignup()">Create Account</button>
    <div id="signupError" class="error-msg"></div>
    <div id="signupSuccess" class="success-msg"></div>
  </div>

  <div class="switch-text">
    Don't have an account? <span id="switchLink" onclick="showSignup()">Sign Up</span>
  </div>
  <div class="footer-text">© 2026 Starq Industriez</div>
</div>

<script>
  // ==============================================
  // GLOBAL TOGGLE FUNCTIONS (Accessible from HTML onclick)
  // ==============================================
  function showLogin() {
    document.getElementById('loginForm').classList.remove('hidden');
    document.getElementById('signupForm').classList.add('hidden');
    document.getElementById('loginToggle').classList.add('active');
    document.getElementById('signupToggle').classList.remove('active');
    document.getElementById('switchLink').textContent = 'Sign Up';
    document.getElementById('switchLink').onclick = showSignup;
    // Clear messages
    document.getElementById('loginError').textContent = '';
    document.getElementById('loginSuccess').textContent = '';
    document.getElementById('signupError').textContent = '';
    document.getElementById('signupSuccess').textContent = '';
  }

  function showSignup() {
    document.getElementById('loginForm').classList.add('hidden');
    document.getElementById('signupForm').classList.remove('hidden');
    document.getElementById('signupToggle').classList.add('active');
    document.getElementById('loginToggle').classList.remove('active');
    document.getElementById('switchLink').textContent = 'Login';
    document.getElementById('switchLink').onclick = showLogin;
    // Clear messages
    document.getElementById('loginError').textContent = '';
    document.getElementById('loginSuccess').textContent = '';
    document.getElementById('signupError').textContent = '';
    document.getElementById('signupSuccess').textContent = '';
  }

  // ==============================================
  // SUPABASE CONFIG & HANDLERS
  // ==============================================
  document.addEventListener('DOMContentLoaded', function() {

    const supabaseUrl = 'https://kowljwcajhtushpsrdxj.supabase.co';
    const supabaseKey = 'sb_publishable_u5RKXb4Mq9OaFl1k74-teQ_9iRMWbyf';
    const supabase = supabase.createClient(supabaseUrl, supabaseKey);

    // ----- Login Handler -----
    window.handleLogin = async function() {
      const email = document.getElementById('loginEmail').value.trim();
      const password = document.getElementById('loginPassword').value.trim();
      const errorDiv = document.getElementById('loginError');
      const successDiv = document.getElementById('loginSuccess');
      errorDiv.textContent = '';
      successDiv.textContent = '';

      if (!email || !password) {
        errorDiv.textContent = 'Please enter email and password.';
        return;
      }

      const { data, error } = await supabase.auth.signInWithPassword({ email, password });
      if (error) {
        errorDiv.textContent = error.message;
      } else {
        successDiv.textContent = '✅ Login successful! Redirecting...';
        setTimeout(() => {
          window.location.href = 'https://starqindustriez.github.io/home.html';
        }, 1000);
      }
    };

    // ----- Signup Handler -----
    window.handleSignup = async function() {
      const name = document.getElementById('signupName').value.trim();
      const email = document.getElementById('signupEmail').value.trim();
      const password = document.getElementById('signupPassword').value.trim();
      const errorDiv = document.getElementById('signupError');
      const successDiv = document.getElementById('signupSuccess');
      errorDiv.textContent = '';
      successDiv.textContent = '';

      if (!name || !email || !password) {
        errorDiv.textContent = 'Please fill in all fields.';
        return;
      }
      if (password.length < 6) {
        errorDiv.textContent = 'Password must be at least 6 characters.';
        return;
      }

      const { data, error } = await supabase.auth.signUp({ email, password });
      if (error) {
        errorDiv.textContent = error.message;
        return;
      }

      const user = data.user;
      if (!user) {
        errorDiv.textContent = 'Sign-up failed. Please try again.';
        return;
      }

      // Write to Supabase 'profiles' table
      const { error: insertError } = await supabase
        .from('profiles')
        .insert([{
          id: user.id,
          email: email,
          name: name,
          points: 10
        }]);

      if (insertError) {
        errorDiv.textContent = 'Error saving profile: ' + insertError.message;
        return;
      }

      // Log signup bonus
      await supabase
        .from('transactions')
        .insert([{
          user_id: user.id,
          points: 10,
          reason: 'Signup Bonus'
        }]);

      successDiv.textContent = '✅ Account created! You earned 10 Starq Points! Check your email to confirm.';
      setTimeout(() => {
        window.location.href = 'https://starqindustriez.github.io/home.html';
      }, 2000);
    };

    // ----- Auto-redirect if already logged in -----
    supabase.auth.getSession().then(({ data }) => {
      if (data.session) {
        window.location.href = 'https://starqindustriez.github.io/home.html';
      }
    });

    supabase.auth.onAuthStateChange((event, session) => {
      if (event === 'SIGNED_IN' && session) {
        window.location.href = 'https://starqindustriez.github.io/home.html';
      }
    });

  }); // End DOMContentLoaded
</script>
</body>
</html>
