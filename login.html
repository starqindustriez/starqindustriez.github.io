<!DOCTYPE html>
<html>
<head>
  <title>Login Test – Starq</title>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body>
  <h2>🔐 Login Test</h2>
  <input type="email" id="email" placeholder="Email"><br><br>
  <input type="password" id="password" placeholder="Password"><br><br>
  <button id="loginBtn">Login</button>
  <div id="message"></div>

  <hr>
  <h3>📝 Sign Up</h3>
  <input type="text" id="signupName" placeholder="Full Name"><br><br>
  <input type="email" id="signupEmail" placeholder="Email"><br><br>
  <input type="password" id="signupPassword" placeholder="Password (min 6)"><br><br>
  <button id="signupBtn">Create Account</button>
  <div id="signupMessage"></div>

  <script>
    // ✅ Use a different variable name (sb) to avoid conflict
    const sb = supabase.createClient(
      'https://kowljwcajhtushpsrdxj.supabase.co',
      'sb_publishable_u5RKXb4Mq9OaFl1k74-teQ_9iRMWbyf'
    );

    // ----- LOGIN -----
    document.getElementById('loginBtn').addEventListener('click', async function() {
      const email = document.getElementById('email').value.trim();
      const password = document.getElementById('password').value.trim();
      const msg = document.getElementById('message');

      if (!email || !password) {
        msg.innerText = '❌ Please fill in both fields.';
        msg.style.color = 'red';
        return;
      }

      const { data, error } = await sb.auth.signInWithPassword({ email, password });
      if (error) {
        msg.innerText = '❌ ' + error.message;
        msg.style.color = 'red';
      } else {
        msg.innerText = '✅ Login successful! Redirecting...';
        msg.style.color = 'green';
        setTimeout(() => {
          window.location.href = 'https://starqindustriez.github.io/home.html';
        }, 1500);
      }
    });

    // ----- SIGNUP -----
    document.getElementById('signupBtn').addEventListener('click', async function() {
      const name = document.getElementById('signupName').value.trim();
      const email = document.getElementById('signupEmail').value.trim();
      const password = document.getElementById('signupPassword').value.trim();
      const msg = document.getElementById('signupMessage');

      if (!name || !email || !password) {
        msg.innerText = '❌ Please fill in all fields.';
        msg.style.color = 'red';
        return;
      }
      if (password.length < 6) {
        msg.innerText = '❌ Password must be at least 6 characters.';
        msg.style.color = 'red';
        return;
      }

      const { data, error } = await sb.auth.signUp({ email, password });
      if (error) {
        msg.innerText = '❌ ' + error.message;
        msg.style.color = 'red';
        return;
      }

      const user = data.user;
      if (!user) {
        msg.innerText = '❌ Sign-up failed. Please try again.';
        msg.style.color = 'red';
        return;
      }

      // Create profile
      await sb.from('profiles').insert([{
        id: user.id,
        email: email,
        name: name,
        points: 10
      }]);

      await sb.from('transactions').insert([{
        user_id: user.id,
        points: 10,
        reason: 'Signup Bonus'
      }]);

      msg.innerText = '✅ Account created! Check your email to confirm.';
      msg.style.color = 'green';
      setTimeout(() => {
        window.location.href = 'https://starqindustriez.github.io/home.html';
      }, 2000);
    });
  </script>
</body>
</html>
