<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Starq Points – Starq Industriez</title>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            background: #0a0a0a;
            color: #00f0ff;
            font-family: 'Segoe UI', Arial, sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 20px;
        }
        .container {
            max-width: 500px;
            width: 100%;
            background: #111;
            padding: 40px 30px;
            border-radius: 20px;
            border: 1px solid #1a1a1a;
            box-shadow: 0 0 60px rgba(0, 240, 255, 0.05);
            text-align: center;
        }
        .logo { font-size: 28px; font-weight: 700; color: #00f0ff; letter-spacing: 2px; margin-bottom: 5px; }
        .logo span { color: #ff00e5; }
        .sub { color: #888; font-size: 14px; margin-bottom: 25px; border-bottom: 1px solid #1a1a1a; padding-bottom: 20px; }
        .form-group { margin-bottom: 15px; text-align: left; }
        .form-group label { display: block; font-size: 13px; color: #00f0ff; margin-bottom: 5px; }
        .form-group input {
            width: 100%; padding: 12px; background: #1a1a1a;
            border: 1px solid #2a2a2a; border-radius: 8px;
            color: #fff; font-size: 15px; outline: none;
        }
        .form-group input:focus { border-color: #00f0ff; }
        .btn {
            width: 100%; padding: 12px; background: #ff00e5; color: #fff;
            border: none; border-radius: 8px; font-size: 16px;
            font-weight: 600; cursor: pointer; margin-top: 5px;
            transition: 0.3s;
        }
        .btn:hover { background: #d400c4; }
        .btn-secondary {
            background: #1a1a1a; border: 1px solid #00f0ff; color: #00f0ff;
        }
        .btn-secondary:hover { background: #00f0ff; color: #0a0a0a; }
        .btn-small { padding: 8px 15px; width: auto; font-size: 14px; }
        .hidden { display: none; }
        .message { padding: 10px; border-radius: 6px; margin: 10px 0; background: #1a1a1a; color: #eee; }
        .message.success { color: #39ff14; background: #1a2a1a; }
        .message.error { color: #ff4444; background: #2a1a1a; }
        .message.info { color: #ffaa00; background: #2a2a1a; }
        .footer-text { margin-top: 25px; font-size: 12px; color: #555; }
        .row { display: flex; gap: 10px; }
        .row .btn { flex: 1; }
        .forgot-link {
            color: #888;
            font-size: 0.85rem;
            cursor: pointer;
            text-decoration: underline;
            transition: 0.3s;
            margin-top: 10px;
            display: inline-block;
        }
        .forgot-link:hover { color: #00f0ff; }
        .reset-section {
            margin-top: 15px;
            padding: 15px;
            background: #1a1a1a;
            border-radius: 10px;
            border: 1px solid #333;
        }
        .reset-section .btn {
            margin-top: 10px;
        }
    </style>
</head>
<body>

<div class="container" id="app">
    <div class="logo">STARQ <span>INDUSTRIEZ</span></div>
    <div class="sub">⚡ Secure. Simple. One-time payment.</div>

    <!-- ===== AUTH SECTION ===== -->
    <div id="auth-section">
        <!-- Full Name (for signup) -->
        <div class="form-group" id="name-field">
            <label>Full Name</label>
            <input type="text" id="signupName" placeholder="Your Full Name">
        </div>

        <!-- Email -->
        <div class="form-group">
            <label>Email</label>
            <input type="email" id="email" placeholder="your@email.com">
        </div>

        <!-- Password -->
        <div class="form-group" id="password-field">
            <label>Password</label>
            <input type="password" id="password" placeholder="*********">
        </div>

        <!-- Buttons -->
        <div class="row">
            <button class="btn" id="signup-btn">Sign Up</button>
            <button class="btn btn-secondary" id="login-btn">Log In</button>
        </div>

        <!-- Forgot Password Link -->
        <div>
            <span class="forgot-link" id="forgotLink">🔑 Forgot Password?</span>
        </div>

        <!-- Reset Password Section (Hidden by default) -->
        <div id="reset-section" class="reset-section hidden">
            <p style="color: #aaa; font-size: 0.9rem; margin-bottom: 10px;">
                Enter your email and SUPABASE will send you a password reset link.
            </p>
            <input type="email" id="resetEmail" placeholder="your@email.com" style="width: 100%; padding: 12px; background: #0A0A0A; border: 1px solid #333; border-radius: 8px; color: #fff; font-size: 1rem; outline: none;">
            <button class="btn btn-secondary" id="resetBtn">Send Reset Link</button>
            <span class="forgot-link" id="cancelReset" style="display: block; margin-top: 10px; font-size: 0.8rem;">Cancel</span>
        </div>

        <div id="auth-message" class="message hidden"></div>
    </div>

    <div class="footer-text">🔒 Your data is safe. Powered by Supabase.</div>
</div>

<script>
    console.log('✅ Script started');

    // ==============================================
    // SUPABASE CREDENTIALS
    // ==============================================
    const SB_URL = 'https://kowljwcajhtushpsrdxj.supabase.co';
    const SB_KEY = 'sb_publishable_u5RKXb4Mq9OaFl1k74-teQ_9iRMWbyf';
    const sb = supabase.createClient(SB_URL, SB_KEY);
    console.log('✅ Supabase initialized');

    // ----- DOM Elements -----
    const authMessage = document.getElementById('auth-message');
    const emailInput = document.getElementById('email');
    const passwordInput = document.getElementById('password');
    const signupNameInput = document.getElementById('signupName');
    const signupBtn = document.getElementById('signup-btn');
    const loginBtn = document.getElementById('login-btn');

    // Forgot Password elements
    const forgotLink = document.getElementById('forgotLink');
    const resetSection = document.getElementById('reset-section');
    const resetEmail = document.getElementById('resetEmail');
    const resetBtn = document.getElementById('resetBtn');
    const cancelReset = document.getElementById('cancelReset');

    // ----- Helper Functions -----
    function showMessage(element, text, type = 'info') {
        element.classList.remove('hidden', 'success', 'error', 'info');
        element.textContent = text;
        element.className = 'message ' + type;
        setTimeout(() => { element.classList.add('hidden'); }, 6000);
    }

    // ==============================================
    // FORGOT PASSWORD — Show/Hide Reset Section
    // ==============================================
    forgotLink.addEventListener('click', function(e) {
        e.preventDefault();
        resetSection.classList.toggle('hidden');
        if (!resetSection.classList.contains('hidden')) {
            resetEmail.focus();
        }
    });

    cancelReset.addEventListener('click', function(e) {
        e.preventDefault();
        resetSection.classList.add('hidden');
        resetEmail.value = '';
    });

    // ==============================================
    // RESET PASSWORD — Send Reset Email
    // ==============================================
    resetBtn.addEventListener('click', async function(e) {
        e.preventDefault();
        const email = resetEmail.value.trim();
        if (!email) {
            showMessage(authMessage, 'Please enter your email address.', 'error');
            return;
        }

        // Show loading state
        resetBtn.textContent = 'Sending...';
        resetBtn.disabled = true;

        try {
            const { data, error } = await sb.auth.resetPasswordForEmail(email, {
                redirectTo: 'https://starqindustriez.github.io/reset-password.html'
            });

            if (error) {
                console.error('Reset error:', error);
                showMessage(authMessage, '❌ ' + error.message, 'error');
            } else {
                showMessage(authMessage, '✅ Password reset link sent to your email!', 'success');
                resetSection.classList.add('hidden');
                resetEmail.value = '';
            }
        } catch (err) {
            console.error('Unexpected error:', err);
            showMessage(authMessage, '❌ Something went wrong. Please try again.', 'error');
        } finally {
            resetBtn.textContent = 'Send Reset Link';
            resetBtn.disabled = false;
        }
    });

    // ==============================================
    // SIGN UP
    // ==============================================
    signupBtn.addEventListener('click', async function(e) {
        e.preventDefault();
        console.log('✅ Sign Up button clicked');
        const name = signupNameInput.value.trim();
        const email = emailInput.value.trim();
        const password = passwordInput.value.trim();

        if (!name || !email || !password) {
            showMessage(authMessage, 'Please fill in all fields.', 'error');
            return;
        }
        if (password.length < 6) {
            showMessage(authMessage, 'Password must be at least 6 characters.', 'error');
            return;
        }

        // Show loading
        signupBtn.textContent = 'Creating...';
        signupBtn.disabled = true;

        try {
            const { data, error } = await sb.auth.signUp({ email, password });
            if (error) {
                console.error('Signup error:', error);
                showMessage(authMessage, '❌ ' + error.message, 'error');
                return;
            }

            const user = data.user;
            if (!user) {
                showMessage(authMessage, '❌ Sign-up failed. Please try again.', 'error');
                return;
            }

            // Create profile with the provided name
            const { error: insertError } = await sb
                .from('profiles')
                .insert([{
                    id: user.id,
                    email: email,
                    name: name,
                    points: 10
                }]);

            if (insertError) {
                console.error('Profile insert error:', insertError);
                showMessage(authMessage, '⚠️ Account created, but profile saving failed.', 'error');
                return;
            }

            // Log signup bonus
            await sb.from('transactions').insert([
                { user_id: user.id, points: 10, reason: 'Signup Bonus' }
            ]);

            showMessage(authMessage, '✅ Account created! You earned 10 Starq Points!', 'success');
            setTimeout(() => {
                window.location.href = 'https://starqindustriez.github.io/home.html';
            }, 1500);

        } catch (err) {
            console.error('Unexpected error:', err);
            showMessage(authMessage, '❌ Something went wrong. Please try again.', 'error');
        } finally {
            signupBtn.textContent = 'Sign Up';
            signupBtn.disabled = false;
        }
    });

    // ==============================================
    // LOGIN
    // ==============================================
    loginBtn.addEventListener('click', async function(e) {
        e.preventDefault();
        console.log('✅ Login button clicked');
        const email = emailInput.value.trim();
        const password = passwordInput.value.trim();

        if (!email || !password) {
            showMessage(authMessage, 'Please fill in all fields.', 'error');
            return;
        }

        // Show loading
        loginBtn.textContent = 'Logging in...';
        loginBtn.disabled = true;

        try {
            const { data, error } = await sb.auth.signInWithPassword({ email, password });
            if (error) {
                console.error('Login error:', error);
                showMessage(authMessage, '❌ ' + error.message, 'error');
            } else {
                console.log('Login success:', data);
                showMessage(authMessage, '✅ Logged in successfully!', 'success');
                setTimeout(() => {
                    window.location.href = 'https://starqindustriez.github.io/home.html';
                }, 1000);
            }
        } catch (err) {
            console.error('Unexpected error:', err);
            showMessage(authMessage, '❌ Something went wrong. Please try again.', 'error');
        } finally {
            loginBtn.textContent = 'Log In';
            loginBtn.disabled = false;
        }
    });

    // ==============================================
    // AUTO-REDIRECT IF ALREADY LOGGED IN
    // ==============================================
    sb.auth.getSession().then(({ data }) => {
        if (data.session) {
            window.location.href = 'https://starqindustriez.github.io/home.html';
        }
    });

    sb.auth.onAuthStateChange((event, session) => {
        if (event === 'SIGNED_IN' && session) {
            window.location.href = 'https://starqindustriez.github.io/home.html';
        }
    });

    console.log('✅ Starq Points script loaded successfully');
</script>
</body>
</html>
