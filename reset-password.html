<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Reset Password – STARQ INDUSTRIEZ</title>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      background: #0A0A0A;
      color: #E0E0E0;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      padding: 20px;
    }
    .container {
      max-width: 420px;
      width: 100%;
      background: #141414;
      padding: 40px 30px;
      border-radius: 16px;
      border: 1px solid #222;
      box-shadow: 0 0 40px rgba(0, 243, 255, 0.05);
      text-align: center;
    }
    .logo h1 {
      color: #00f3ff;
      font-size: 2rem;
      font-weight: 700;
      letter-spacing: 2px;
      margin-bottom: 6px;
    }
    .logo p {
      color: #888;
      font-size: 0.9rem;
      margin-bottom: 30px;
    }
    .form-group { margin-bottom: 18px; text-align: left; }
    .form-group label {
      display: block;
      color: #aaa;
      font-size: 0.85rem;
      margin-bottom: 5px;
    }
    .form-group input {
      width: 100%;
      padding: 12px 14px;
      background: #0A0A0A;
      border: 1px solid #333;
      border-radius: 8px;
      color: #E0E0E0;
      font-size: 1rem;
      outline: none;
      transition: 0.3s;
    }
    .form-group input:focus { border-color: #00f3ff; }
    .btn-primary {
      width: 100%;
      padding: 14px;
      background: #00f3ff;
      color: #0A0A0A;
      font-weight: 700;
      border: none;
      border-radius: 8px;
      font-size: 1rem;
      cursor: pointer;
      transition: 0.3s;
      margin-top: 8px;
    }
    .btn-primary:hover {
      background: #00c8d4;
      box-shadow: 0 0 20px rgba(0, 243, 255, 0.3);
    }
    .message {
      padding: 12px;
      border-radius: 8px;
      margin-top: 15px;
      font-size: 0.9rem;
    }
    .message.success { color: #39ff14; background: #1a2a1a; }
    .message.error { color: #ff4444; background: #2a1a1a; }
    .message.info { color: #ffaa00; background: #2a2a1a; }
    .footer-text {
      text-align: center;
      color: #555;
      font-size: 0.75rem;
      margin-top: 25px;
      border-top: 1px solid #222;
      padding-top: 18px;
    }
    .hidden { display: none; }
  </style>
</head>
<body>

<div class="container">
  <div class="logo">
    <h1>⚡ STARQ INDUSTRIEZ</h1>
    <p>Set a new password</p>
  </div>

  <div id="message" class="message info">Checking your reset link...</div>

  <div id="reset-form" class="hidden">
    <div class="form-group">
      <label>New Password</label>
      <input type="password" id="newPassword" placeholder="Enter new password (min 6 chars)">
    </div>
    <div class="form-group">
      <label>Confirm Password</label>
      <input type="password" id="confirmPassword" placeholder="Confirm new password">
    </div>
    <button class="btn-primary" id="updateBtn">Update Password</button>
  </div>

  <div class="footer-text">© 2026 Starq Industriez</div>
</div>

<script>
  // ==============================================
  // SUPABASE CONFIG
  // ==============================================
  const supabaseUrl = 'https://kowljwcajhtushpsrdxj.supabase.co';
  const supabaseKey = 'sb_publishable_u5RKXb4Mq9OaFl1k74-teQ_9iRMWbyf';
  const supabase = supabase.createClient(supabaseUrl, supabaseKey);

  // ==============================================
  // DOM REFS
  // ==============================================
  const newPassword = document.getElementById('newPassword');
  const confirmPassword = document.getElementById('confirmPassword');
  const updateBtn = document.getElementById('updateBtn');
  const messageDiv = document.getElementById('message');
  const resetForm = document.getElementById('reset-form');

  function showMessage(text, type = 'info') {
    messageDiv.classList.remove('hidden', 'success', 'error', 'info');
    messageDiv.textContent = text;
    messageDiv.className = 'message ' + type;
  }

  // ==============================================
  // CHECK AUTHENTICATION (WITH DEBUGGING)
  // ==============================================
  async function checkAuth() {
    console.log('🔍 Checking session...');

    try {
      // Get session
      const { data, error } = await supabase.auth.getSession();

      if (error) {
        console.error('❌ Session error:', error);
        showMessage('❌ Error checking session: ' + error.message, 'error');
        resetForm.classList.add('hidden');
        return;
      }

      console.log('📦 Session data:', data);

      if (data.session) {
        console.log('✅ Session found!');
        resetForm.classList.remove('hidden');
        showMessage('✅ You can now set a new password.', 'success');
      } else {
        console.log('❌ No session found.');
        showMessage('❌ Invalid or expired reset link. Please request a new one.', 'error');
        resetForm.classList.add('hidden');
      }
    } catch (err) {
      console.error('❌ Unexpected error:', err);
      showMessage('❌ Something went wrong. Please try again.', 'error');
      resetForm.classList.add('hidden');
    }
  }

  // ==============================================
  // RUN CHECK
  // ==============================================
  checkAuth();

  // ==============================================
  // LISTEN FOR AUTH STATE CHANGES
  // ==============================================
  supabase.auth.onAuthStateChange((event, session) => {
    console.log('🔄 Auth state changed:', event, session);

    if (event === 'PASSWORD_RECOVERY' || event === 'SIGNED_IN') {
      resetForm.classList.remove('hidden');
      showMessage('✅ Password recovery confirmed. Set a new password.', 'success');
    }

    if (event === 'SIGNED_OUT') {
      resetForm.classList.add('hidden');
      showMessage('❌ You have been signed out. Please request a new reset link.', 'error');
    }
  });

  // ==============================================
  // UPDATE PASSWORD
  // ==============================================
  updateBtn.addEventListener('click', async function() {
    const password = newPassword.value.trim();
    const confirm = confirmPassword.value.trim();

    if (!password || !confirm) {
      showMessage('❌ Please fill in both fields.', 'error');
      return;
    }

    if (password.length < 6) {
      showMessage('❌ Password must be at least 6 characters.', 'error');
      return;
    }

    if (password !== confirm) {
      showMessage('❌ Passwords do not match.', 'error');
      return;
    }

    this.textContent = 'Updating...';
    this.disabled = true;

    try {
      const { data, error } = await supabase.auth.updateUser({
        password: password
      });

      if (error) {
        console.error('❌ Update error:', error);
        showMessage('❌ ' + error.message, 'error');
      } else {
        showMessage('✅ Password updated successfully! Redirecting to login...', 'success');
        setTimeout(() => {
          window.location.href = 'https://starqindustriez.github.io/points.html';
        }, 2000);
      }
    } catch (err) {
      console.error('❌ Unexpected error:', err);
      showMessage('❌ Something went wrong. Please try again.', 'error');
    } finally {
      this.textContent = 'Update Password';
      this.disabled = false;
    }
  });
</script>
</body>
</html>
